# Netlify détecte Next.js et ajoute son adaptateur. La commande passe par npm pour lancer le prebuild,
# qui bloque un build de production tant que la carte n'est pas validée.
[build]
  command = "npm run build"
  publish = ".next"
  # Avant le lancement : aucun build de production. Netlify saute le build quand cette commande sort
  # avec 0 (docs.netlify.com, « Ignore builds » : la variable BRANCH y est lisible). Les préversions des
  # PR (branche autre que main) se construisent normalement. À retirer à la bascule (docs/mise-en-ligne.md).
  ignore = 'if [ "$BRANCH" = "main" ]; then echo "Build de production sauté : site pas encore lancé."; exit 0; fi; exit 1'

[build.environment]
  NODE_VERSION = "22"

# Déclaré ici car le site Netlify a été créé quand main ne contenait pas encore Next.js :
# sans cette ligne, Netlify publie le dossier .next brut et toutes les pages répondent 404.
[[plugins]]
  package = "@netlify/plugin-nextjs"

# Manifeste de la tablette (fichier de public/, servi par le CDN sans passer par Next) : son vrai type.
[[headers]]
  for = "/tablette.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"
