# Netlify détecte Next.js et ajoute son adaptateur. La commande passe par npm pour lancer le prebuild,
# qui bloque un build de production tant que la carte n'est pas validée.
[build]
  command = "npm run build"
  publish = ".next"
  # Netlify saute le build quand cette commande sort avec 0 (docs.netlify.com, « Ignore builds »).
  # Netlify sobre (docs/netlify-sobre.md) : main sautée avant le lancement, puis seulement avec [production]
  # dans le dernier commit ; Dependabot jamais ; une préversion seulement avec [preview] dans le dernier
  # commit ou le label « preview » sur la PR. Les vérifications GitHub (docs/filet.md) testent toutes les PR.
  # Bascule : une ligne du script (docs/mise-en-ligne.md).
  ignore = "bash scripts/netlify/ignorer-build.sh"

[build.environment]
  NODE_VERSION = "22"

# Déclaré ici car le site Netlify a été créé quand main ne contenait pas encore Next.js :
# sans cette ligne, Netlify publie le dossier .next brut et toutes les pages répondent 404.
[[plugins]]
  package = "@netlify/plugin-nextjs"

# Manifeste de la tablette (fichier de public/, servi par le CDN sans passer par Next) : son vrai type.
[[headers]]
  for = "/tablette.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"
